<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <style>

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    
    body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    }

    body > div {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    align-content: center;
    gap: 30px;
    }

    /* body > div > div { */
    body > div > div:not(.resultCard){
    background-color: rgb(202, 250, 250);
    width: 300px;
    height: 450px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 5px solid rgb(252, 99, 99);
    border-radius: 12px;
    }

    body > div > div > h1 {
    font-size: 20px;
    text-align: center;
    }

    body > div > div > h2 {
    font-size: 22px;
    text-align: center;
    }
    body > div > div > h3 {
    font-size: 14px;
    text-align: center;
    }
    
    /* body > div > div > img { */
    body > div > div:not(.resultCard) > img {
    width: 200px;
    height: 200px;
    }

    body > div > div > p {
    font-size: 14px;
    text-align: justify;
    }

    body > div > div > button {
    width: 100px;
    height: 40px;
    background: linear-gradient(to left, white,rgb(163, 233, 157));
    border-radius: 12px;
    }

    .apiCard .resultCard {
    width: 100%;
    height: auto;
    background: none;
    border: none;
    padding: 0;
    border-radius: 0;
    }

    .resultCard > div {
    background-color: rgb(202, 250, 250);
    width: 300px;
    height: 450px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 5px solid rgb(252, 99, 99);
    border-radius: 12px;
    }

    .resultCard > div > img {
    width: 200px;
    height: 200px;
    }

    .resultCard {
    display: flex;
    flex-direction: row;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    }

    .resultCard > div > button {
    width: 100px;
    height: 40px;
    background: linear-gradient(to left, white, rgb(163, 233, 157));
    border-radius: 12px;
    }

    #search {
    width: 300px;
    height: 50px;
    }

    .apiCard > button {
    width: 150px;
    height: 40px;
    margin: 20px 5px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(to right, rgb(252, 99, 99), rgb(163, 233, 157));
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.apiCard > button:hover {
    transform: scale(1.05);
    box-shadow: 0 3px 8px gray;
}
    </style>
</head>
<body>
    <!-- <h2>JavaScript practice  beginner tasks.</h2>
